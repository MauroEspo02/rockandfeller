<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Gratta e vinci · Rock and Feller</title>
  <meta name="theme-color" content="#155634">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="preload" href="/fonts/alfa-slab-one.woff" as="font" type="font/woff" crossorigin>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/gratta.css">
</head>
<body class="gv">
  <main class="gv__main">
    <a class="gv__logo" href="/"><img src="/img/logo.svg" alt="Rock and Feller" width="621" height="396"></a>
    <div class="ticket-card" id="card">
      <div class="ticket-card__frame checker" aria-hidden="true"></div>
      <div class="ticket-card__inner">
        <h1 class="ticket-card__title display">Gratta<br>e vinci</h1>
        <p class="ticket-card__prize" id="prize">&nbsp;</p>
        <div class="scratch" id="scratch">
          <div class="scratch__result" id="result" aria-live="polite"></div>
          <canvas class="scratch__layer" id="layer" aria-hidden="true"></canvas>
        </div>
        <p class="ticket-card__hint" id="hint">Un attimo…</p>
        <button type="button" class="ticket-card__reveal" id="reveal" hidden>Scopri senza grattare</button>
      </div>
    </div>
    <p class="gv__rules" id="rules"></p>
  </main>
  <canvas class="confetti" id="confetti" aria-hidden="true"></canvas>
  <script type="module" src="/js/gratta.js"></script>
</body>
</html>
